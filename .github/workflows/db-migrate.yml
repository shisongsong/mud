name: Database migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: development
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Export optional CA file
        if: ${{ secrets.DATABASE_SSL_CA_FILE != '' }}
        run: echo "DATABASE_SSL_CA_FILE=${{ secrets.DATABASE_SSL_CA_FILE }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run database migration
        run: npm run db:migrate --workspace=@mud/api
